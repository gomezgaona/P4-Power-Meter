[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp39f511n-logger"
version = "0.1.0"
description = "Dual-channel power logger for the Microchip MCP39F511N over UART"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.scripts]
mcp39f511n-logger = "mcp39f511n.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp39f511n"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
